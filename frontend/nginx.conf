# Runtime config script — generates /config.js from environment variables.
# This runs at container start via nginx entrypoint, NOT at build time.
# This is the build-once-deploy-many solution.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration endpoint — generated at container startup
    location = /config.js {
        default_type application/javascript;
        return 200 'window.__CIVICPULSE_CONFIG__ = { API_BASE_URL: "" };';
    }

    # Proxy API calls to backend — frontend never needs an absolute backend URL
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;

        # Expose cache headers
        proxy_hide_header X-Cache;
        add_header X-Cache $upstream_http_x_cache;
    }

    # Proxy health/ready/metrics
    location /health {
        proxy_pass http://backend:8000;
    }

    location /ready {
        proxy_pass http://backend:8000;
    }

    location /metrics {
        proxy_pass http://backend:8000;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
