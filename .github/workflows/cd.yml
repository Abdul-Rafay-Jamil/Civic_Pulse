name: CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: postgresql+asyncpg://civicpulse:civicpulse@127.0.0.1:5432/civicpulse
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse
          POSTGRES_DB: civicpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U civicpulse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          for i in $(seq 1 30); do
            python -c "import socket; s = socket.socket(); s.connect(('127.0.0.1', 5432)); s.close()" 2>/dev/null && break
            echo "Waiting for postgres..."
            sleep 1
          done
          for i in $(seq 1 30); do
            python -c "import socket; s = socket.socket(); s.connect(('127.0.0.1', 6379)); s.close()" 2>/dev/null && break
            echo "Waiting for redis..."
            sleep 1
          done
          alembic upgrade head
          pytest --cov=app --cov-fail-under=65 -v
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm install --no-audit
          npm test

  build-push:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-digest-backend: ${{ steps.push-backend.outputs.digest }}
      image-digest-frontend: ${{ steps.push-frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: push-backend
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}/backend"
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./backend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:${{ github.sha }} 2>/dev/null || echo "")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        id: push-frontend
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}/frontend"
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./frontend
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:${{ github.sha }} 2>/dev/null || echo "")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Generate SBOM
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft ghcr.io/${REPO_LOWER}/backend:${{ github.sha }} -o spdx-json > backend-sbom.json || true
          syft ghcr.io/${REPO_LOWER}/frontend:${{ github.sha }} -o spdx-json > frontend-sbom.json || true

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Create k3d cluster
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d cluster create civicpulse-ci --wait --timeout 180s || k3d cluster create civicpulse-ci || true

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Deploy with SHA tag
        run: |
          # Install VPA CRD so VerticalPodAutoscaler is recognized by Kubernetes in k3d
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/autoscaler/master/vertical-pod-autoscaler/deploy/vpa-v1-crd.yaml || true

          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cd k8s/overlays/prod
          kustomize edit set image \
            ghcr.io/civicpulse/backend=ghcr.io/${REPO_LOWER}/backend:${{ github.sha }} \
            ghcr.io/civicpulse/frontend=ghcr.io/${REPO_LOWER}/frontend:${{ github.sha }}
          kustomize build . | kubectl apply --validate=false -f - || kustomize build . | kubectl apply -f - || true

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n civicpulse --timeout=120s || true
          kubectl rollout status deployment/frontend -n civicpulse --timeout=120s || true

      - name: Smoke test
        run: |
          kubectl get all -n civicpulse || true
          kubectl get hpa -n civicpulse || true

      - name: Cleanup
        if: always()
        run: k3d cluster delete civicpulse-ci || true
