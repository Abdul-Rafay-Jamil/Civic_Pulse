name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Backend: ruff + mypy
      - name: Install backend dev dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Ruff lint
        working-directory: backend
        run: ruff check --fix app/ && ruff check app/
      - name: Mypy type check
        working-directory: backend
        run: mypy app/ --ignore-missing-imports

      # Frontend: eslint + tsc --noEmit
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit
      - name: ESLint
        working-directory: frontend
        run: npx eslint src/ || true
      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: postgresql+asyncpg://civicpulse:civicpulse@127.0.0.1:5432/civicpulse
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: civicpulse
          POSTGRES_PASSWORD: civicpulse
          POSTGRES_DB: civicpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U civicpulse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            python -c "import socket; s = socket.socket(); s.connect(('127.0.0.1', 5432)); s.close()" 2>/dev/null && break
            echo "Waiting for postgres..."
            sleep 1
          done
          for i in $(seq 1 30); do
            python -c "import socket; s = socket.socket(); s.connect(('127.0.0.1', 6379)); s.close()" 2>/dev/null && break
            echo "Waiting for redis..."
            sleep 1
          done
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=65 -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit
      - name: Run tests
        working-directory: frontend
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t civicpulse-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t civicpulse-frontend:ci ./frontend

  scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build images for scanning
        run: |
          docker build -t civicpulse-backend:scan ./backend
          docker build -t civicpulse-frontend:scan ./frontend
      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: civicpulse-backend:scan
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: civicpulse-frontend:scan
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: kustomize build k8s/overlays/prod | kubeconform -strict -ignore-missing-schemas -summary

  integration:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for compose
        run: cp .env.example .env
      - name: Start services
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i/60..."
            sleep 2
          done
      - name: Run migration and seed
        run: |
          docker compose exec -T backend alembic upgrade head
          docker compose exec -T backend python -m app.seed
      - name: Integration test - POST complaint
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:8000/api/complaints \
            -H "Content-Type: application/json" \
            -d '{"text":"Burst water main flooding Street 12 since fajr, water entering ground floors","location":"Street 12, Gulberg III, Lahore"}')
          echo "$RESPONSE"
          ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Created complaint: $ID"
          # GET it back
          curl -sf http://localhost:8000/api/complaints/$ID | python3 -m json.tool
      - name: Integration test - Cache behavior
        run: |
          # First call — may be MISS or error if Redis not connected yet
          curl -sv http://localhost:8000/api/stats 2>&1 | grep -i "X-Cache" || echo "X-Cache header not present (Redis may not be connected)"
          # Second call — should be HIT if cache is working
          curl -sv http://localhost:8000/api/stats 2>&1 | grep -i "X-Cache" || echo "X-Cache header not present"
      - name: Tear down
        if: always()
        run: docker compose down -v
