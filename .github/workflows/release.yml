name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with semver tags
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TAG=${GITHUB_REF#refs/tags/}
          BACKEND="ghcr.io/${REPO_LOWER}/backend"
          FRONTEND="ghcr.io/${REPO_LOWER}/frontend"

          docker build -t $BACKEND:$TAG -t $BACKEND:latest ./backend
          docker push $BACKEND:$TAG
          docker push $BACKEND:latest

          docker build -t $FRONTEND:$TAG -t $FRONTEND:latest ./frontend
          docker push $FRONTEND:$TAG
          docker push $FRONTEND:latest

      - name: Generate release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
