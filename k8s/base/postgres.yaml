# PostgreSQL as a StatefulSet with volumeClaimTemplates → PVC.
# A Deployment for a database is a marked error.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: civicpulse
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: civicpulse
            - name: POSTGRES_DB
              value: civicpulse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: civicpulse-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "civicpulse"]
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "civicpulse"]
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "civicpulse"]
            failureThreshold: 30
            periodSeconds: 2
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
