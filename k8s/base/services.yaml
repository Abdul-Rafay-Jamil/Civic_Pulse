# ClusterIP Services for all — the database is never a NodePort or LoadBalancer
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicpulse
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: civicpulse
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: civicpulse
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
  # Never NodePort or LoadBalancer for the database
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: civicpulse
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
